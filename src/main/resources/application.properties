spring.application.name=resto-ops-api

# Updated by Jaisivapavan
# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/resto-ops-api
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8081

logging.level.org.springframework.security: DEBUG 


# ✅ This is the correct syntax for .properties!
app.jwt.secret=change-this-to-a-long-random-string-at-least-256-bits-for-hs256-minimum-32-chars
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

